[package]
name = "dalang-cli"
version = "0.1.0"
edition = "2021"
default-run = "dalang"

[[bin]]
name = "dalang"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false }
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
crossterm = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS: use native-tls (OpenSSL) by default, rustls for cross-compilation
[features]
default = ["native"]
native = ["ureq/native-tls", "tungstenite/native-tls", "dep:native-tls"]
rustls = ["ureq/tls", "tungstenite/rustls-tls-webpki-roots"]

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.27", features = ["windows"] }

[dependencies.native-tls]
version = "0.2"
optional = true

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
